name: Build unsigned Celechron IPA
on:
  push:
    branches: [build/unsigned-ios-724e54a, integration/upstream-fixes-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - name: Get dependencies and run regression tests
        run: |
          flutter pub get
          flutter test --no-pub
          flutter test --no-pub --dart-define=CELECHRON_PRIVATE_KEYCHAIN=true test/sideload_keychain_test.dart
      - name: Build device archive without signing
        run: flutter build ipa --release --no-pub --no-codesign --dart-define=CELECHRON_PRIVATE_KEYCHAIN=true
      - name: Package iPhone app with widgets and companion watch app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir Payload
          app=Payload/Runner.app
          ditto "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" "$app"
          watch="$app/Watch/CelechronWatch.app"
          find "$app" \( -name '*.app' -o -name '*.appex' -o -name '_CodeSignature' \) -print
          for bundle in "$app" "$app/PlugIns/WidgetExtensions.appex" "$watch" "$watch/PlugIns/WatchWidgetExtensions.appex"; do
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
            test -x "$bundle/$exe" || { echo "::error::Missing executable: $bundle/$exe"; exit 1; }
          done
          # Check Mach-O files directly: copied resource seals alone do not
          # indicate that the corresponding executable is signed.
          while IFS= read -r -d '' binary; do
            case "$(file -b "$binary")" in *Mach-O*) ;; *) continue ;; esac
            if codesign -d "$binary" 2>/dev/null; then
              echo "Removing embedded signature: $binary"
              codesign --remove-signature "$binary"
            fi
            if codesign -d "$binary" 2>/dev/null; then
              echo "::error::Signature remains: $binary"; exit 1
            fi
          done < <(find "$app" -type f -print0)
          find "$app" -type d -name _CodeSignature -prune -exec rm -r {} +
          find "$app" -type f -name embedded.mobileprovision -delete
          ditto -c -k --norsrc --keepParent Payload "$GITHUB_WORKSPACE/Celechron-Sideloadly-1.3.1.ipa"
          unzip -tq "$GITHUB_WORKSPACE/Celechron-Sideloadly-1.3.1.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Celechron-Sideloadly
          path: Celechron-Sideloadly-1.3.1.ipa
          if-no-files-found: error
          retention-days: 7
